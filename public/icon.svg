<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.4" />
  
  <!-- Network Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.3" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" />

  <!-- Cloud Body -->
  <path d="M380 280c25 0 45-20 45-45 0-23-17-41-39-44-6-48-47-85-96-85-35 0-66 19-82 48-7-4-15-7-24-7-25 0-45 20-45 45 0 3 0 7 1 10-33 6-58 35-58 70 0 39 31 70 70 70h225c27 0 50-22 50-49 0-7-2-14-5-20-4 4-8 7-13 7z" 
        fill="#1e293b" opacity="0.85" filter="url(#glow)" />
  <path d="M380 280c25 0 45-20 45-45 0-23-17-41-39-44-6-48-47-85-96-85-35 0-66 19-82 48-7-4-15-7-24-7-25 0-45 20-45 45 0 3 0 7 1 10-33 6-58 35-58 70 0 39 31 70 70 70h225c27 0 50-22 50-49 0-7-2-14-5-20-4 4-8 7-13 7z" 
        fill="none" stroke="#38bdf8" stroke-width="12" stroke-linejoin="round" />

  <!-- High-Speed Multi-Thread Downloader Arrow -->
  <g filter="url(#glow)">
    <path d="M256 190 v160" stroke="url(#arrowGrad)" stroke-width="28" stroke-linecap="round" />
    <path d="M190 280 l66 68 l66 -68" fill="none" stroke="url(#arrowGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Speed Base Platform -->
  <path d="M170 390 h172" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.9" />

  <!-- Signal Dots -->
  <circle cx="210" cy="425" r="8" fill="#10b981" />
  <circle cx="256" cy="425" r="8" fill="#38bdf8" />
  <circle cx="302" cy="425" r="8" fill="#818cf8" />
</svg>
