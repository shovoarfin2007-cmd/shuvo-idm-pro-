name: Build Windows Desktop EXE (Shuvo IDM Pro)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -D electron electron-builder --legacy-peer-deps

      - name: Compile React Frontend
        run: npm run build
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

      - name: Build Windows .EXE Installer
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .EXE Installer to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shuvo_IDM_Pro_Windows_EXE
          path: |
            dist-electron/*.exe
            dist-electron/win-unpacked/
          if-no-files-found: warn
