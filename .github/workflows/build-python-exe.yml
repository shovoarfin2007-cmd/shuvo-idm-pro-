name: Build Python Windows EXE (Shuvo IDM Pro)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-python-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Windows .EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --clean --add-data "dist;dist" --name="Shuvo_IDM_Pro" shuvo_idm_desktop.py

      - name: Upload .EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuvo_IDM_Pro_Python_EXE
          path: dist/Shuvo_IDM_Pro.exe
          if-no-files-found: error
